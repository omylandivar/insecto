// ---------- utilidades ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const approach = (v, t, d) => (v < t ? Math.min(t, v + d) : Math.max(t, v - d));
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------- lienzo ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const msg = document.getElementById('start');
let W = 0, H = 0, DPR = 1, K = 1, BL = 120, EXT = 300;
const bodyH = A.bodyBox[3] - A.bodyBox[1];
const C = A.center;

function computeExtent() {
  // radio máximo del sprite desde el centro (antenas, patas, cuerpo)
  let m = 0;
  const pt = (x, y) => { m = Math.max(m, Math.hypot(x - C[0], y - C[1])); };
  for (const an of A.antennas) pt(an.bx + Math.cos(an.ang) * an.len * 1.35, an.by + Math.sin(an.ang) * an.len * 1.35);
  for (const l of A.legs) { pt(l.x, l.y); pt(l.x + l.w, l.y); pt(l.x, l.y + l.h); pt(l.x + l.w, l.y + l.h); }
  pt(A.body.x, A.body.y); pt(A.body.x + A.body.w, A.body.y + A.body.h);
  return m + 40;
}
const EXT_SPRITE = computeExtent();

// --- marcha tipo trípode: apoyo (pata atrás, pegada al piso) y vuelo (pata adelante, rápida y levantada)
const STRIDE = 150;   // px del sprite que recorre cada pata durante el apoyo
const DS = 0.58;      // fracción del ciclo en apoyo
const LEG = A.legs.map(function (l, i) {
  let reach = 0;
  [[l.x, l.y], [l.x + l.w, l.y], [l.x, l.y + l.h], [l.x + l.w, l.y + l.h]].forEach(function (c) {
    reach = Math.max(reach, Math.hypot(c[0] - l.px, c[1] - l.py));
  });
  const row = Math.floor(i / 2);
  return { th: 0, lift: 0, row: row, grp: (row + (l.side === 1 ? 0 : 1)) % 2,
           amp: clamp(STRIDE / (2 * reach), 0.12, 0.5) };
});
const walkRate = function (v) { return clamp(2 * Math.PI * DS * v / (STRIDE * K), 0, 30); };

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  BL = clamp(Math.min(W, H) * 0.40, 110, 260);
  K = BL / bodyH;
  EXT = EXT_SPRITE * K;
}
window.addEventListener('resize', resize);
resize();

// ---------- imágenes ----------
let bodyImg = null, legImgs = [], ready = false;
function load(b64) {
  return new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = 'data:image/png;base64,' + b64; });
}
Promise.all([load(A.body.png)].concat(A.legs.map(l => load(l.png)))).then(imgs => {
  bodyImg = imgs[0]; legImgs = imgs.slice(1); ready = true;
  msg.innerHTML = 'Toca la pantalla una vez para iniciar<br><small>La cucaracha aparece a los 5 segundos. Entrega el celular.</small>';
});

// ---------- audio y vibración ----------
let AC = null;
function audioInit() {
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.resume) AC.resume(); } catch (e) { AC = null; }
}
function noise(dur, freq, gain, type) {
  if (!AC) return;
  try {
    const n = Math.max(1, (AC.sampleRate * dur) | 0);
    const buf = AC.createBuffer(1, n, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.5);
    const src = AC.createBufferSource(); src.buffer = buf;
    const f = AC.createBiquadFilter(); f.type = type || 'highpass'; f.frequency.value = freq;
    const g = AC.createGain(); g.gain.value = gain;
    src.connect(f); f.connect(g); g.connect(AC.destination); src.start();
  } catch (e) {}
}
function thump() {
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.setValueAtTime(110, AC.currentTime); o.frequency.exponentialRampToValueAtTime(38, AC.currentTime + 0.25);
    g.gain.setValueAtTime(0.5, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.3);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.32);
  } catch (e) {}
}
function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

// ---------- estado de la cucaracha ----------
const R = { x: 0, y: 0, a: 0, v: 0, phase: 0, t: 0, zoom: 1, sway: 0, ox: 0, oy: 0, shx: 0, shy: 0,
            legAmp: 0.05, walkK: 0, turnSign: 1, phaseRate: 0, pauseMode: false, visible: false, digging: false, tremor: 0 };
let run = null;

// ---------- trayecto ----------
function bez(p0, c1, c2, p1, t) {
  const u = 1 - t;
  return { x: u*u*u*p0.x + 3*u*u*t*c1.x + 3*u*t*t*c2.x + t*t*t*p1.x,
           y: u*u*u*p0.y + 3*u*u*t*c1.y + 3*u*t*t*c2.y + t*t*t*p1.y };
}

function newRun(delay) {
  // entra por el inicio (arriba) y recorre la pantalla hasta el otro extremo (abajo)
  const p0 = { x: W * rnd(0.3, 0.7), y: -EXT };
  const side = 'top';
  const hc0 = { x: W * rnd(0.3, 0.7), y: Math.min(H * 0.9, H - 0.85 * BL) };
  let dx = hc0.x - p0.x, dy = hc0.y - p0.y; const dl = Math.hypot(dx, dy); dx /= dl; dy /= dl;
  const tc = { x: hc0.x, y: hc0.y };
  const dist = Math.hypot(tc.x - p0.x, tc.y - p0.y);
  const px = -dy, py = dx;
  const o1 = rnd(-0.07, 0.07) * dist, o2 = rnd(-0.07, 0.07) * dist;
  const c1 = { x: p0.x + (tc.x - p0.x) * 0.33 + px * o1, y: p0.y + (tc.y - p0.y) * 0.33 + py * o1 };
  const c2 = { x: p0.x + (tc.x - p0.x) * 0.68 + px * o2, y: p0.y + (tc.y - p0.y) * 0.68 + py * o2 };
  const pts = []; let s = 0;
  const N = 140;
  for (let i = 0; i <= N; i++) {
    const p = bez(p0, c1, c2, tc, i / N);
    if (i > 0) s += Math.hypot(p.x - pts[i - 1].x, p.y - pts[i - 1].y);
    pts.push({ x: p.x, y: p.y, s: s });
  }
  const pa = pts[N - 4], pb = pts[N];
  const angEnd = Math.atan2(pb.y - pa.y, pb.x - pa.x);
  const hole = { x: tc.x + Math.cos(angEnd) * 0.62 * BL, y: tc.y + Math.sin(angEnd) * 0.62 * BL };
  run = {
    state: 'wait', wait: delay, t: 0, s: 0, path: { pts: pts, L: s, angEnd: angEnd },
    m: { vt: BL * 1.0, nextEvent: 0.3, pause: 0, pauses: 0, boost: 0 },
    d: { t: 0, fired: [false, false, false], burst: false },
    turn: { t: 0, dir: 1, a0: 0 }, off: { x: 0, y: 0 },
    fx: { hx: hole.x, hy: hole.y, cracks: null, Rv: 0, maxR: 0, h: 0, hv: null, shards: [] }
  };
  R.visible = false; R.v = 0; R.ox = R.oy = R.shx = R.shy = 0; R.zoom = 1; R.legAmp = 0.05;
  R.pauseMode = false; R.digging = false;
}

function sampleAt(path, s) {
  const pts = path.pts, n = pts.length;
  if (s <= 0) {
    const a = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);
    return { x: pts[0].x + Math.cos(a) * s, y: pts[0].y + Math.sin(a) * s, ang: a };
  }
  if (s >= path.L) {
    return { x: pts[n - 1].x, y: pts[n - 1].y, ang: path.angEnd };
  }
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (pts[mid].s <= s) lo = mid; else hi = mid; }
  const p = pts[lo], q = pts[hi];
  const u = (s - p.s) / Math.max(1e-6, q.s - p.s);
  return { x: p.x + (q.x - p.x) * u, y: p.y + (q.y - p.y) * u, ang: Math.atan2(q.y - p.y, q.x - p.x) };
}

// ---------- grietas y agujero ----------
function jagged(x, y, ang, len, jit, d0) {
  const pts = [{ x: x, y: y, d: d0 || 0 }];
  const segs = Math.max(4, Math.round(len / (BL * 0.14)));
  let cx = x, cy = y, d = d0 || 0;
  for (let i = 0; i < segs; i++) {
    const a = ang + (Math.random() - 0.5) * jit * 2;
    const sl = (len / segs) * rnd(0.7, 1.3);
    cx += Math.cos(a) * sl; cy += Math.sin(a) * sl; d += sl;
    pts.push({ x: cx, y: cy, d: d });
  }
  return pts;
}
function pointAtDist(poly, d) {
  for (let i = 0; i < poly.length - 1; i++) {
    if (poly[i + 1].d >= d) {
      const u = (d - poly[i].d) / Math.max(1e-6, poly[i + 1].d - poly[i].d);
      return { x: poly[i].x + (poly[i + 1].x - poly[i].x) * u, y: poly[i].y + (poly[i + 1].y - poly[i].y) * u };
    }
  }
  return null;
}
function genCracks(hx, hy) {
  const maxR = Math.min(Math.hypot(W, H) * 0.6, BL * 3.4);
  const radials = [], mains = [];
  const n = 11;
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2 + rnd(-0.22, 0.22);
    const Lc = maxR * rnd(0.5, 1.0);
    const poly = jagged(hx, hy, ang, Lc, 0.26, 0);
    const o = { pts: poly, w: 2.3 - 1.2 * (Lc / maxR), ang: ang };
    radials.push(o); mains.push(o);
    for (let b = 2; b < poly.length - 1; b++) {
      if (Math.random() < 0.26) {
        const off = Math.random() < 0.5 ? -1 : 1;
        radials.push({ pts: jagged(poly[b].x, poly[b].y, ang + off * rnd(0.5, 1.0), Lc * rnd(0.16, 0.4), 0.3, poly[b].d), w: 1.0 });
      }
    }
  }
  mains.sort((p, q) => p.ang - q.ang);
  const rings = [];
  for (const rr of [0.55, 0.95, 1.55]) {
    const rd = rr * BL;
    for (let i = 0; i < mains.length; i++) {
      const A1 = mains[i], B1 = mains[(i + 1) % mains.length];
      const p = pointAtDist(A1.pts, rd), q = pointAtDist(B1.pts, rd);
      if (!p || !q) continue;
      const mx = (p.x + q.x) / 2 + rnd(-1, 1) * BL * 0.05, my = (p.y + q.y) / 2 + rnd(-1, 1) * BL * 0.05;
      rings.push({ pts: [p, { x: mx, y: my }, q], d: rd });
    }
  }
  // agujero irregular
  const hv = [];
  const nv = 16;
  for (let i = 0; i < nv; i++) hv.push({ a: (i / nv) * Math.PI * 2, r: rnd(0.78, 1.22), r2: rnd(1.1, 1.5) });
  return { cracks: { radials: radials, rings: rings }, maxR: maxR, hv: hv };
}

function strokeCrackSet(set, Rv, dx, dy, color, wk) {
  ctx.strokeStyle = color;
  for (const r of set.radials) {
    ctx.lineWidth = Math.max(0.6, r.w * wk);
    const p = r.pts;
    ctx.beginPath();
    let started = false;
    for (let i = 0; i < p.length - 1; i++) {
      if (p[i].d >= Rv) break;
      let ex = p[i + 1].x, ey = p[i + 1].y;
      if (p[i + 1].d > Rv) {
        const u = (Rv - p[i].d) / (p[i + 1].d - p[i].d);
        ex = p[i].x + (p[i + 1].x - p[i].x) * u; ey = p[i].y + (p[i + 1].y - p[i].y) * u;
      }
      if (!started) { ctx.moveTo(p[i].x + dx, p[i].y + dy); started = true; }
      ctx.lineTo(ex + dx, ey + dy);
    }
    ctx.stroke();
  }
  ctx.lineWidth = Math.max(0.5, 0.9 * wk);
  for (const rg of set.rings) {
    const a = clamp((Rv - rg.d) / (BL * 0.25), 0, 1);
    if (a <= 0) continue;
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.moveTo(rg.pts[0].x + dx, rg.pts[0].y + dy);
    ctx.lineTo(rg.pts[1].x + dx, rg.pts[1].y + dy);
    ctx.lineTo(rg.pts[2].x + dx, rg.pts[2].y + dy);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawFx() {
  const f = run.fx;
  if (!f.cracks) return;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (f.Rv > 2) {
    const g = ctx.createRadialGradient(f.hx, f.hy, 0, f.hx, f.hy, f.Rv * 0.9 + 1);
    g.addColorStop(0, 'rgba(255,255,255,0.40)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.hx, f.hy, f.Rv * 0.9 + 1, 0, Math.PI * 2); ctx.fill();
    strokeCrackSet(f.cracks, f.Rv, 1, 1, 'rgba(255,255,255,0.75)', 0.6);
    strokeCrackSet(f.cracks, f.Rv, 0, 0, 'rgba(18,18,24,0.92)', 1);
  }
  if (f.h > 0) {
    const R0 = 0.34 * BL;
    const r = R0 * easeOutBack(clamp(f.h, 0, 1));
    // borde de vidrio triturado
    ctx.beginPath();
    for (let i = 0; i < f.hv.length; i++) {
      const v = f.hv[i], rr = r * v.r2 * 1.12;
      const x = f.hx + Math.cos(v.a) * rr, y = f.hy + Math.sin(v.a) * rr;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(250,250,252,0.9)'; ctx.fill();
    ctx.strokeStyle = 'rgba(60,64,72,0.7)'; ctx.lineWidth = 1; ctx.stroke();
    // vacío oscuro
    ctx.beginPath();
    for (let i = 0; i < f.hv.length; i++) {
      const v = f.hv[i], rr = r * v.r;
      const x = f.hx + Math.cos(v.a) * rr, y = f.hy + Math.sin(v.a) * rr;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    const g = ctx.createRadialGradient(f.hx, f.hy, 0, f.hx, f.hy, r * 1.25 + 1);
    g.addColorStop(0, '#000'); g.addColorStop(0.65, '#0b0605'); g.addColorStop(1, '#2b1d17');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 1.2; ctx.stroke();
  }
  // esquirlas
  for (const s of f.shards) {
    const a = clamp(s.life / s.max, 0, 1);
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(240,244,248,0.95)'; ctx.strokeStyle = 'rgba(90,100,110,0.8)'; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.moveTo(-s.size, s.size * 0.6); ctx.lineTo(s.size * 1.1, 0); ctx.lineTo(-s.size * 0.3, -s.size); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function spawnShards(f) {
  for (let i = 0; i < 22; i++) {
    const a = rnd(0, Math.PI * 2), sp = rnd(120, 460);
    f.shards.push({ x: f.hx, y: f.hy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: rnd(0, 6.28),
                    vr: rnd(-12, 12), size: rnd(2.5, 7), life: rnd(0.6, 1.2), max: 1.2 });
  }
}

// ---------- dibujo de la cucaracha ----------
function drawAntenna(an) {
  const N = 26, L = an.len * 1.35, seg = L / N;
  const t = R.t;
  const bend = (an.side === 1 ? -1 : 1) * 0.45;
  const flurry = R.pauseMode ? 1 : 0;
  const mv = clamp(R.v / (BL * 1.2), 0, 1);
  const wAmp = 0.06 + 0.09 * flurry + 0.03 * mv + (run && run.state === 'dig' ? 0.08 : 0);
  const f = 3.2 + 3 * mv + 2.5 * flurry;
  let x = an.bx, y = an.by;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#7e4a2a';
  for (let i = 0; i < N; i++) {
    const u = i / N;
    const a = an.ang + bend * Math.pow(u, 1.2) +
      wAmp * Math.pow(u, 1.4) * (Math.sin(t * f + i * 0.28 + an.side * 1.3) + 0.6 * Math.sin(t * f * 1.9 + i * 0.5));
    const nx = x + Math.cos(a) * seg, ny = y + Math.sin(a) * seg;
    ctx.lineWidth = 6.4 * (1 - u) + 1.9 * u;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(nx, ny); ctx.stroke();
    x = nx; y = ny;
  }
}

function drawRoach() {
  ctx.save();
  ctx.translate(R.x + R.ox + R.shx, R.y + R.oy + R.shy);
  ctx.rotate(R.a + Math.PI / 2 + R.sway);
  const z = K * R.zoom;
  ctx.scale(z, z);
  ctx.translate(-C[0], -C[1]);

  // sombra suave
  ctx.save();
  ctx.translate(C[0] + 16, C[1] + 22);
  ctx.scale(0.72, 1.12);
  const g = ctx.createRadialGradient(0, 0, 10, 0, 0, 330);
  g.addColorStop(0, 'rgba(0,0,0,0.30)'); g.addColorStop(0.7, 'rgba(0,0,0,0.13)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 330, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  for (const an of A.antennas) drawAntenna(an);

  for (let i = 0; i < A.legs.length; i++) {
    const l = A.legs[i];
    ctx.save();
    ctx.translate(l.px, l.py);
    ctx.rotate(LEG[i].th);
    const ls = 1 + 0.05 * LEG[i].lift;
    ctx.scale(ls, ls);
    ctx.drawImage(legImgs[i], l.x - l.px, l.y - l.py, l.w, l.h);
    ctx.restore();
  }
  ctx.drawImage(bodyImg, A.body.x, A.body.y, A.body.w, A.body.h);
  ctx.restore();
}

// ---------- lógica ----------
function walk(dt, dir) {
  const m = run.m;
  m.nextEvent -= dt;
  m.boost = Math.max(0, m.boost - dt);
  if (m.pause > 0) {
    m.pause -= dt;
    R.v = approach(R.v, 0, BL * 9 * dt);
    R.pauseMode = true;
    if (m.pause <= 0) R.pauseMode = false;
  } else {
    if (m.nextEvent <= 0) {
      const vis = R.x > 0 && R.x < W && R.y > 0 && R.y < H;
      const rem = run.path.L - run.s;
      if (dir > 0 && vis && rem > 1.8 * BL && m.pauses < 3 && Math.random() < 0.45) {
        m.pause = rnd(0.5, 1.4); m.pauses++; m.nextEvent = m.pause + 1.0;
      } else {
        m.vt = BL * (dir > 0 ? rnd(0.6, 1.1) : rnd(0.75, 1.15));
        m.nextEvent = rnd(0.8, 2.0);
      }
    }
    R.v = approach(R.v, m.vt * (m.boost > 0 ? 2.0 : 1), BL * 7 * dt);
  }
  // el cuerpo avanza a impulsos, al ritmo de los pasos
  const vEff = R.v * (1 + 0.10 * Math.sin(2 * R.phase));
  run.s += dir * vEff * dt;
  const p = sampleAt(run.path, run.s);
  const target = dir > 0 ? p.ang : p.ang + Math.PI;
  R.a += clamp(angDiff(R.a, target), -9 * dt, 9 * dt);
  const k = Math.exp(-2.2 * dt);
  run.off.x *= k; run.off.y *= k;
  R.x = p.x + run.off.x; R.y = p.y + run.off.y;
  R.walkK = clamp(R.v / (BL * 0.18), 0, 1);
  R.turnSign = 1;
}

function crackProgAt(t) {
  const seg = [[0.5, 0.9, 0, 0.34], [1.2, 1.55, 0.34, 0.7], [1.9, 2.35, 0.7, 1.0]];
  let p = 0;
  for (const s of seg) {
    if (t >= s[1]) p = s[3];
    else if (t > s[0]) { p = s[2] + (s[3] - s[2]) * easeOut((t - s[0]) / (s[1] - s[0])); break; }
    else break;
  }
  return p;
}

function startDig() {
  run.state = 'dig';
  R.v = 0; R.pauseMode = false;
  const f = run.fx;
  const g = genCracks(f.hx, f.hy);
  f.cracks = g.cracks; f.maxR = g.maxR; f.hv = g.hv;
}

function updateDig(dt) {
  const d = run.d, f = run.fx;
  d.t += dt;
  const t = d.t;
  R.v = 0;
  const scrabble = t > 0.45 && t < 3.5;
  R.legAmp = scrabble ? 1.4 : 0.1;
  R.phaseRate = scrabble ? 38 : 2;
  R.tremor = t < 0.45 ? 0.2 : (t < 2.4 ? 0.5 + ((t - 0.45) / 1.95) : (t < 3.5 ? 0.35 : 0.05));
  R.shx = (Math.random() - 0.5) * R.tremor * 3.2;
  R.shy = (Math.random() - 0.5) * R.tremor * 3.2;
  R.pauseMode = t > 3.5;

  [0.5, 1.2, 1.9].forEach((tt, i) => {
    if (!d.fired[i] && t >= tt) {
      d.fired[i] = true;
      noise(0.09, 2200, 0.35 + i * 0.1); noise(0.2, 500, 0.12, 'lowpass');
      buzz(i === 2 ? [40, 30, 60] : 35);
    }
  });
  f.Rv = crackProgAt(t) * f.maxR;

  if (t >= 2.4 && !d.burst) {
    d.burst = true;
    spawnShards(f);
    noise(0.35, 700, 0.5); noise(0.25, 3000, 0.4); thump();
    buzz([90, 40, 160]);
  }
  f.h = clamp((t - 2.4) / 0.35, 0, 1);

  let z = 1;
  if (t < 0.45) z = 1 - 0.03 * (t / 0.45);
  else if (t < 2.4) z = 0.97;
  else if (t < 2.65) z = 0.97 + 0.09 * easeOut((t - 2.4) / 0.25);
  else z = 1.06 - 0.06 * clamp((t - 2.65) / 0.9, 0, 1);
  R.zoom = z;

  let push = 0;
  if (t >= 2.4) push = BL * 0.16 * easeOut(clamp((t - 2.4) / 0.4, 0, 1)) * (1 - clamp((t - 3.4) / 0.5, 0, 1));
  R.ox = Math.cos(R.a) * push; R.oy = Math.sin(R.a) * push;

  if (t >= 3.9) {
    run.state = 'turn';
    run.turn.t = 0; run.turn.dir = Math.random() < 0.5 ? -1 : 1; run.turn.a0 = R.a;
    R.ox = R.oy = R.shx = R.shy = 0; R.zoom = 1;
  }
}

function updateTurn(dt) {
  const tn = run.turn;
  tn.t += dt;
  const u = clamp(tn.t / 1.6, 0, 1);
  const prevA = R.a;
  R.a = tn.a0 + tn.dir * Math.PI * easeInOut(u);
  // avanza un poco en arco mientras gira
  R.v = BL * 0.30 * Math.sin(Math.PI * u);
  run.off.x += Math.cos(R.a) * R.v * dt; run.off.y += Math.sin(R.a) * R.v * dt;
  const pe = sampleAt(run.path, run.path.L);
  R.x = pe.x + run.off.x; R.y = pe.y + run.off.y;
  R.walkK = 0.75; R.turnSign = tn.dir; R.phaseRate = 10; R.pauseMode = false;
  if (u >= 1) {
    run.state = 'out';
    R.a = tn.a0 + tn.dir * Math.PI;
    run.m.pause = 0; run.m.vt = BL * 0.9; run.m.nextEvent = 0.8; run.m.boost = 0;
  }
}

function update(dt) {
  R.t += dt;
  if (!run) return;
  run.t += dt;
  let rate = 0;
  switch (run.state) {
    case 'wait':
      run.wait -= dt;
      if (run.wait <= 0) {
        run.state = 'in'; R.visible = true; R.v = 0;
        const p = sampleAt(run.path, 0); R.x = p.x; R.y = p.y; R.a = p.ang;
      }
      break;
    case 'in':
      walk(dt, +1);
      rate = walkRate(R.v);
      if (run.s >= run.path.L) { run.s = run.path.L; run.state = 'rest'; run.rest = rnd(1.2, 2.0); R.v = 0; }
      break;
    case 'rest':
      R.v = 0; R.walkK = 0; R.pauseMode = true; run.rest -= dt;
      if (run.rest <= 0) {
        run.state = 'turn'; run.turn.t = 0; run.turn.dir = Math.random() < 0.5 ? -1 : 1; run.turn.a0 = R.a;
      }
      break;
    case 'dig':
      updateDig(dt); rate = R.phaseRate; break;
    case 'turn':
      updateTurn(dt); rate = R.phaseRate; break;
    case 'out':
      walk(dt, -1);
      rate = walkRate(R.v);
      if (run.s <= -20) { run.state = 'done'; R.visible = false; }
      break;
  }
  const prev = R.phase;
  R.phase += rate * dt;
  if (Math.floor(R.phase / Math.PI) !== Math.floor(prev / Math.PI) && R.v > BL * 0.4 && R.x > 0 && R.x < W && R.y > 0 && R.y < H) {
    noise(0.018, 3500, 0.05);
  }
  const mv = clamp(R.v / BL, 0, 1);
  R.sway = 0.028 * Math.sin(R.phase) * mv;

  // pose de cada pata: apoyo lineal hacia atrás, vuelo rápido hacia adelante con levantamiento
  const wk = (run.state === 'in' || run.state === 'out' || run.state === 'turn') ? (R.walkK || 0) : 0;
  const kk = 1 - Math.exp(-dt * 38);
  for (let i = 0; i < LEG.length; i++) {
    const L = LEG[i], l = A.legs[i];
    const pp = (((R.phase / (2 * Math.PI)) + L.grp * 0.5) % 1 + 1) % 1;
    let f, lift = 0;
    if (pp < DS) f = 1 - 2 * (pp / DS);
    else { const q = (pp - DS) / (1 - DS); f = -1 + 2 * easeInOut(q); lift = Math.sin(Math.PI * q); }
    const dirK = run.state === 'turn' ? (l.side === 1 ? 1 : -1) * run.turn.dir : 1;
    const target = l.side * L.amp * f * wk * dirK;
    L.th += (target - L.th) * kk;
    L.lift += (lift * wk - L.lift) * kk;
  }

  // esquirlas
  const sh = run.fx.shards;
  for (let i = sh.length - 1; i >= 0; i--) {
    const s = sh[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.96; s.vy *= 0.96; s.rot += s.vr * dt; s.life -= dt;
    if (s.life <= 0) sh.splice(i, 1);
  }
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, W * 0.4, H);
  g.addColorStop(0, '#f3f2ef'); g.addColorStop(1, '#dad8d2');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (!run || !ready) return;
  drawFx();
  if (R.visible) drawRoach();
}

let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, ((now - last) / 1000) || 0.016);
  last = now;
  update(dt);
  render();
}

// ---------- interacción ----------
let started = false;
const params = new URLSearchParams(location.search);
const START_DELAY = params.has('delay') ? Math.max(0, parseFloat(params.get('delay'))) : 5;

function onTap() {
  if (!ready) return;
  if (!started) {
    started = true;
    msg.style.display = 'none';
    audioInit();
    try { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {}); } catch (e) {}
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
    buzz(10);
    newRun(START_DELAY);
    return;
  }
  if (!run) return;
  if (run.state === 'in' || run.state === 'out') run.m.boost = 0.7;
  else if (run.state === 'done') { audioInit(); newRun(1.2); }
}
window.addEventListener('pointerdown', onTap);

requestAnimationFrame(frame);

// ganchos para pruebas automáticas
if (window.__TEST__) {
  window.__roach = {
    start: function (delay) { started = true; msg.style.display = 'none'; newRun(delay || 0); },
    step: function (dt) { update(dt); }, render: render, state: function () { return { run: run, R: R, W: W, H: H, BL: BL, K: K }; },
    isReady: function () { return ready; }
  };
}
})();

</script>
